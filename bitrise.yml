format_version: '11'
default_step_lib_source: https://github.com/bitrise-io/bitrise-steplib.git

project_type: android

workflows:
  primary:
    summary: Compilación y generación automática de APK Android para TCL GamePulse
    description: |
      Workflow optimizado para instalar dependencias, compilar los assets web con Vite,
      sincronizar Capacitor y compilar el APK nativo con permisos de Wi-Fi y Bluetooth.
    steps:
    - activate-ssh-key@4:
        run_if: '{{getenv "SSH_RSA_PRIVATE_KEY" | ne ""}}'
    - git-clone-repo@1: {}
    - restore-npm-cache@1: {}
    - script@1:
        title: Instalar dependencias npm y Vite
        inputs:
          content: |
            #!/usr/bin/env bash
            set -ex
            echo "📦 Instalando dependencias de Node..."
            npm install --legacy-peer-deps || npm install

            echo "🚀 Compilando la WebApp con Vite..."
            npx --yes vite build

            echo "📱 Sincronizando con Capacitor Android..."
            if [ ! -d "android" ]; then
              npx cap add android
            fi
            npx cap sync android
    - save-npm-cache@1: {}
    - restore-gradle-cache@1: {}
    - install-missing-android-tools@3:
        inputs:
          gradlew_path: android/gradlew
    - android-build@1:
        title: Compilar APK Android
        inputs:
          project_location: android
          module: app
          variant: debug
          build_type: apk
    - sign-apk@1:
        title: Firmar APK
        run_if: '{{getenv "BITRISEIO_ANDROID_KEYSTORE_URL" | ne ""}}'
        inputs:
          apk_path: $BITRISE_APK_PATH
    - save-gradle-cache@1: {}
    - deploy-to-bitrise-io@2:
        title: Desplegar y publicar APK descargable (.apk)
        inputs:
          notify_user_groups: none
          is_compress: 'false'

meta:
  bitrise.io:
    stack: linux-docker-android-22.04
