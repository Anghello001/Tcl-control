format_version: '11'
default_step_lib_source: https://github.com/bitrise-io/bitrise-steplib.git

project_type: android

workflows:
  primary:
    summary: Compilación y generación automática de APK Android para TCL GamePulse
    description: |
      Este workflow descarga el repositorio, compila los assets web con Vite,
      sincroniza con Capacitor Android y genera el archivo APK (.apk) optimizado
      con permisos completos de Wi-Fi LAN, Multicast y Bluetooth.
    steps:
    - activate-ssh-key@4:
        run_if: '{{getenv "SSH_RSA_PRIVATE_KEY" | ne ""}}'
    - git-clone-repo@1: {}
    - restore-npm-cache@1: {}
    - npm@1:
        title: Instalar dependencias npm
        inputs:
          command: install
    - save-npm-cache@1: {}
    - script@1:
        title: Compilar WebApp y Sincronizar Capacitor Android
        inputs:
          content: |
            #!/usr/bin/env bash
            set -ex
            echo "🚀 Compilando la WebApp para producción..."
            npm run build

            echo "📱 Sincronizando con Capacitor Android..."
            if [ ! -d "android" ]; then
              npx cap add android
            fi
            npx cap sync android
    - restore-gradle-cache@1: {}
    - install-missing-android-tools@3:
        inputs:
          gradlew_path: android/gradlew
    - android-build@1:
        title: Compilar APK Android (Debug / Release)
        inputs:
          project_location: android
          module: app
          variant: debug
          build_type: apk
    - sign-apk@1:
        title: Firmar APK para instalación directa
        run_if: '{{getenv "BITRISEIO_ANDROID_KEYSTORE_URL" | ne ""}}'
        inputs:
          apk_path: $BITRISE_APK_PATH
    - save-gradle-cache@1: {}
    - deploy-to-bitrise-io@2:
        title: Desplegar y publicar APK descargable
        inputs:
          notify_user_groups: none
          is_compress: 'false'

  release-apk:
    summary: Generar APK de lanzamiento firmado para distribución
    steps:
    - activate-ssh-key@4:
        run_if: '{{getenv "SSH_RSA_PRIVATE_KEY" | ne ""}}'
    - git-clone-repo@1: {}
    - npm@1:
        inputs:
          command: install
    - script@1:
        title: Build & Sync
        inputs:
          content: |
            #!/usr/bin/env bash
            set -ex
            npm run build
            npx cap sync android
    - android-build@1:
        inputs:
          project_location: android
          module: app
          variant: release
          build_type: apk
    - sign-apk@1:
        inputs:
          apk_path: $BITRISE_APK_PATH
    - deploy-to-bitrise-io@2: {}

meta:
  bitrise.io:
    stack: linux-docker-android-22.04
